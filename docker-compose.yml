services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: resqx-postgis
    environment:
      POSTGRES_DB: resqx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resqx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: resqx-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/resqx
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: resqx-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
